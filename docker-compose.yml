version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: callivaan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: callivaan
      POSTGRES_PASSWORD: callivaan_dev_password
      POSTGRES_DB: callivaan_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U callivaan -d callivaan_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: callivaan-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: callivaan-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://callivaan:callivaan_dev_password@postgres:5432/callivaan_dev
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  media-gateway:
    build:
      context: .
      dockerfile: apps/media-gateway/Dockerfile
    container_name: callivaan-media-gateway
    restart: unless-stopped
    ports:
      - '4001:4001'
    environment:
      NODE_ENV: production
      MEDIA_PORT: 4001
      API_BASE_URL: http://api:4000
      DATABASE_URL: postgres://callivaan:callivaan_dev_password@postgres:5432/callivaan_dev
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: callivaan-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://callivaan:callivaan_dev_password@postgres:5432/callivaan_dev
      REDIS_URL: redis://redis:6379
      API_BASE_URL: http://api:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
